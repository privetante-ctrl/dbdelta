# Comment the risks of a schema change on every pull request that touches it.
#
# Copy to .github/workflows/ and adjust SCHEMA to where your desired schema lives. The job
# compares the schema on the target branch with the one in the pull request, posts the
# Markdown report as a comment (updated on every push) and fails on dangerous changes.
name: Schema check

on:
  pull_request:
    paths: ["db/schema.sql"]

permissions:
  contents: read
  pull-requests: write

env:
  SCHEMA: db/schema.sql

jobs:
  dbdelta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6

      - name: Schema on the target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git show "origin/$BASE_REF:$SCHEMA" > "$RUNNER_TEMP/current.sql"

      - name: Check the migration
        run: >-
          uvx --from git+https://github.com/privetante-ctrl/dbdelta dbdelta check
          "$RUNNER_TEMP/current.sql" "$SCHEMA"
          --format markdown --output "$RUNNER_TEMP/report.md"

      - name: Comment on the pull request
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file "$RUNNER_TEMP/report.md" --edit-last --create-if-none
