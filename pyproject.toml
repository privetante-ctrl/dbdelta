[project]
name = "dbdelta"
version = "0.1.0.dev0"
description = "Compare two database schemas and generate a safe migration script with warnings about dangerous operations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["database", "schema", "migration", "diff", "postgresql", "sqlite", "ddl"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    # sqlglot ships breaking AST changes in every major release.
    "sqlglot>=30,<31",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.urls]
Repository = "https://github.com/privetante-ctrl/dbdelta"
Changelog = "https://github.com/privetante-ctrl/dbdelta/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
