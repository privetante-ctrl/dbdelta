# A PostgreSQL server for the test suite:
#   docker compose up -d --wait
#   export DBDELTA_TEST_POSTGRES_URL=postgresql://postgres:postgres@localhost:5432/postgres
#   uv run pytest
# POSTGRES_VERSION selects the server, e.g. POSTGRES_VERSION=14 docker compose up -d --wait.
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Test data is thrown away; skipping durability makes the round-trip tests faster.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
