name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Ruff lint
        run: uv run ruff check --output-format=github
      - name: Ruff format
        run: uv run ruff format --check
      - name: mypy --strict
        run: uv run mypy
      - name: Architecture contracts
        run: uv run lint-imports

  test:
    name: Tests (Python ${{ matrix.python-version }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each Python version meets a different server: the oldest supported, the one the
        # snapshots were taken on, and the newest.
        include:
          - python-version: "3.11"
            postgres: "14"
          - python-version: "3.12"
            postgres: "16"
          - python-version: "3.13"
            postgres: "18"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBDELTA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Install pg_dump ${{ matrix.postgres }}
        # The runner's client is older than the newest server, which pg_dump refuses to dump.
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-${{ matrix.postgres }}
      - name: Run tests
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage of the core (diff, risk, plan) is at least 90 %
        run: >-
          uv run coverage report --fail-under=90
          --include='*/dbdelta/diff/*,*/dbdelta/risk/*,*/dbdelta/plan/*'
      - name: Upload coverage report
        if: matrix.postgres == '16'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Build the wheel and sdist
        run: uv build
      - name: Run the installed wheel on the example
        working-directory: examples/shop
        run: |
          uvx --from "$(ls ../../dist/*.whl)" dbdelta --version
          uvx --from "$(ls ../../dist/*.whl)" dbdelta diff current.sql desired.sql

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --tag dbdelta:ci .
      - name: Run the image on the example
        run: |
          docker run --rm dbdelta:ci --version
          docker run --rm --volume "$PWD/examples/shop:/work" dbdelta:ci \
            plan current.sql desired.sql --detect-renames
